name: CI

# THIS REPO DOES NOT PUBLISH. mill DOES.
#
# This file is copybara-exported from millstonehq/mill, and until 2026-08-29 it carried its own
# `+push` job -- so both repos published the SAME moving tag,
# ghcr.io/millstonehq/provider-tailscale:xpkg, which the live Provider auto-activates
# (revisionActivationPolicy: Automatic). Two writers racing on a tag that deploys itself is the
# kind of thing that is fine until the day it is not.
#
# It never actually collided only because the export chain has been skipping since 2026-03-05, so
# nothing reached this repo to trigger it. That is a stalled pipeline, not a safeguard.
#
# mill is the single publisher: .github/workflows/ci-provider-tailscale.yml, on self-hosted
# runners. This repo validates -- pull requests and pushes both build and test, so an external
# contribution is still checked here before copybara carries it back.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Test
        uses: ./.github/actions/earthly-build
        with:
          earthly-target: '+test-all'
          push: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: success()
        run: |
          echo "✓ provider-upjet-tailscale built and tested successfully"
          echo "  - All tests passed"
          echo "  - Example validation passed"
          echo "  - Coverage threshold met (40%+)"

      - name: Check if commit is from Copybara Export
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: check-origin
        run: |
          # Check if the latest commit has GitOrigin-RevId (means it came from mill export)
          if git log -1 --format=%B | grep -q "GitOrigin-RevId:"; then
            echo "is_from_mill=true" >> $GITHUB_OUTPUT
            echo "⏭️  Skipping import: commit came from mill (has GitOrigin-RevId)"
          else
            echo "is_from_mill=false" >> $GITHUB_OUTPUT
            echo "✓ Will trigger import: external contribution detected"
          fi

      - name: Generate GitHub App Token for Cross-Repo Dispatch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check-origin.outputs.is_from_mill == 'false'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.COPYBARA_APP_ID }}
          private-key: ${{ secrets.COPYBARA_APP_PRIVATE_KEY }}
          repositories: mill,provider-upjet-tailscale

      - name: Trigger Copybara Import to Mill
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check-origin.outputs.is_from_mill == 'false'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: millstonehq/mill
          event-type: copybara-import-provider-upjet-tailscale
