name: Build provider-upjet-tailscale
description: Build and test provider-upjet-tailscale using Earthly
inputs:
  earthly-target:
    description: 'Earthly target to build (e.g., +test-all, +push)'
    required: false
    default: '+test-all'
  push:
    description: 'Whether to push images (adds --push flag)'
    required: false
    default: 'false'
  working-directory:
    description: 'Directory containing the Earthfile (defaults to providers/provider-upjet-tailscale in mill, . in FOSS)'
    required: false
    default: '.'
  github-token:
    description: 'GitHub token for authenticating to GHCR'
    required: true

runs:
  using: composite
  steps:
    # BOTH OF THESE NEED A LOCAL DOCKER DAEMON, AND A SELF-HOSTED RUNNER HAS NONE.
    #
    # arc-runner-set/values.yaml refuses containerMode: dind because "it would grant privileged
    # execution to anything that can open a PR", so these pods have no /var/run/docker.sock. On
    # 2026-08-16 that made setup-buildx fail in under a second with "failed to connect to the
    # docker API", which then SKIPPED every later step including the build -- so the job reported
    # a docker error for a build that never ran.
    #
    # They are also pointless against a remote builder even where docker exists: earth talks to a
    # buildkitd on another machine, which has its own platform support, and QEMU registered on the
    # runner does nothing for it.
    #
    # GUARDED ON runner.environment, NOT ON env.EARTH_BUILDKIT_HOST, AND THE DIFFERENCE IS NOT
    # COSMETIC. The `env` context in an `if:` expression contains only variables declared in a
    # workflow/job/step `env:` block. EARTH_BUILDKIT_HOST is injected into the runner POD by
    # arc-runner-set/values.yaml, so a `run:` shell sees it and an `if:` expression does NOT --
    # `env.EARTH_BUILDKIT_HOST == ''` is therefore TRUE on the self-hosted runner and the step
    # executes exactly as before. A guard that silently never fires is worse than no guard,
    # because the next reader believes the case is handled.
    #
    # runner.environment is 'github-hosted' or 'self-hosted' and is supplied by the runner itself,
    # so it needs nothing declared anywhere. Hosted behaviour is unchanged and the
    # copybara-exported public repos, which have no shared buildkitd and genuinely need local
    # buildx, keep working exactly as before.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      if: runner.environment == 'github-hosted'

    - name: Set up QEMU for multi-platform builds
      uses: docker/setup-qemu-action@v3
      if: runner.environment == 'github-hosted'
      with:
        platforms: linux/amd64,linux/arm64

    - name: Download Earthly
      shell: bash
      run: |
        # PINNED AND ARCH-DETECTED. This was `releases/latest/.../earthly-linux-amd64`: a build
        # that changes under you, and an amd64 binary, which is an exec-format error on the arm64
        # runner pool these jobs are moving to. Both faults are invisible until the move.
        # The version matches earthbuild/buildkitd on both shared builders -- mismatched BuildKit
        # versions produce different cache keys, so client and daemon move together.
        # $HOME/.local/bin because the ARC runner image has no sudo; GITHUB_PATH does not affect
        # the step that writes it, so PATH is set here too. Installed as `earth` with an `earthly`
        # symlink, so ~60 existing call sites resolve without a rename in this change.
        EARTH_VERSION=v0.8.18
        case "$(uname -m)" in
          x86_64)        EARTH_ARCH=amd64 ;;
          aarch64|arm64) EARTH_ARCH=arm64 ;;
          *) echo "::error::unsupported machine $(uname -m)"; exit 1 ;;
        esac
        mkdir -p "$HOME/.local/bin"
        curl -fsSL "https://github.com/earthbuild/earthbuild/releases/download/${EARTH_VERSION}/earth-linux-${EARTH_ARCH}" -o "$HOME/.local/bin/earth"
        chmod +x "$HOME/.local/bin/earth"
        ln -sf "$HOME/.local/bin/earth" "$HOME/.local/bin/earthly"
        export PATH="$HOME/.local/bin:$PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        # TLS OFF, BUT ONLY WHEN THERE IS A REMOTE BUILDKIT TO REACH. The shared buildkitds answer
        # on in-cluster DNS, not the public internet, and earth otherwise demands a CA at
        # ~/.earthly/certs -- failing by trying to start a LOCAL buildkitd via docker, which these
        # runner pods deliberately have no daemon for. Guarded on the variable so a GitHub-hosted
        # run, which uses a local buildkitd with its own generated certs, is left alone. The
        # variable is set on every runner pod by arc-runner-set/values.yaml, so moving a workflow
        # to self-hosted needs no change here beyond `runs-on:`.
        if [ -n "${EARTH_BUILDKIT_HOST:-}" ]; then earthly config global.tls_enabled false; fi
        earthly --version

    # GHCR CREDENTIALS, WRITTEN AS A FILE BECAUSE THERE IS NO DOCKER DAEMON TO LOG IN WITH.
    #
    # WITHOUT THIS THE REMOTE CACHE FLAGS ARE INERT. The build already passes
    # --remote-cache=ghcr.io/millstonehq/cache:... --max-remote-cache, but nothing ever
    # authenticated, and that package is PRIVATE -- so Earthly could neither pull the cache
    # nor push it. Measured 2026-08-24: the tag existed but was last written 2026-03-06,
    # six months earlier. Every provider build was therefore a full cold build while the
    # flags advertised caching that never happened. For an upjet provider that regenerates
    # 213 CRDs from the Terraform schema, that is about an hour, every time, holding two of
    # four self-hosted runners.
    #
    # `docker login` IS NOT AVAILABLE HERE, AND THAT IS DELIBERATE UPSTREAM. These runners
    # have no /var/run/docker.sock -- arc-runner-set/values.yaml refuses containerMode: dind
    # because it would grant privileged execution to anything that can open a PR. Earthly
    # does not need the daemon though: it reads ~/.docker/config.json and forwards the
    # credentials to the remote buildkitd over its session, so writing the file is enough.
    - name: Authenticate to GHCR for the remote cache
      shell: bash
      env:
        GHCR_TOKEN: ${{ inputs.github-token }}
      run: |
        if [ -z "${GHCR_TOKEN:-}" ]; then
          echo "::error::github-token was not supplied; the remote cache would be silently skipped"
          exit 1
        fi
        mkdir -p "$HOME/.docker"
        AUTH=$(printf '%s' "x-access-token:${GHCR_TOKEN}" | base64 -w0)
        printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$AUTH" > "$HOME/.docker/config.json"
        chmod 600 "$HOME/.docker/config.json"
        echo "wrote ghcr.io credentials for the remote cache"

    - name: Build with Earthly
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FORCE_COLOR: 1
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        PUSH_FLAG=""
        CACHE_FLAGS="--remote-cache=ghcr.io/millstonehq/cache:provider-upjet-tailscale --max-remote-cache"

        if [ "${{ inputs.push }}" == "true" ]; then
          PUSH_FLAG="--push"
        fi

        # -P ONLY FOR THE TARGETS THAT ACTUALLY NEED IT, WHICH IS NOT +test-all.
        #
        # -P (--allow-privileged) makes the CLIENT request the security.insecure entitlement at
        # solve time, whether or not the target uses it. buildkitd denies entitlements it is not
        # explicitly configured to allow, so passing it unconditionally killed every run:
        #
        #   failed to solve: granting entitlement security.insecure is not allowed by
        #     build daemon configuration
        #   Help: earth --allow-privileged (earth -P) flag is required
        #
        # The help text names the flag that was ALREADY there, which is why this read as a
        # missing-flag bug. CI - Provider Tailscale failed on main and every branch from
        # 2026-08-17 -- the day CI moved onto self-hosted buildkitd -- until 2026-08-24.
        #
        # WHICH TARGETS NEED IT, read off the Earthfile rather than guessed:
        #
        #   Earthfile:188  WITH DOCKER   (+controller-tarball, reached via +package-build/+push)
        #   Earthfile:204  LOCALLY       (+push-images)
        #   Earthfile:256  LOCALLY       (+push)
        #
        # +test-all is BUILD +test plus BUILD +test-examples and touches none of them.
        #
        # The alternative was allowing security.insecure on the daemon, which would hand every
        # build root on a shared, persistent builder in order to satisfy a flag the failing job
        # never needed. Narrowing the flag is the cheaper and safer half of that trade.
        PRIV_FLAG=""
        case "${{ inputs.earthly-target }}" in
          +push|+push-images|+push-xpkg|+create-manifest|+package-build|+controller-tarball)
            PRIV_FLAG="-P" ;;
        esac

        earthly --ci $PRIV_FLAG --secret GITHUB_TOKEN $PUSH_FLAG $CACHE_FLAGS ${{ inputs.earthly-target }}
