# Default values for provider-tailscale
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Provider configuration
provider:
  # Provider package image
  package:
    # Container registry and repository
    repository: ghcr.io/millstonehq/provider-tailscale
    # Image tag (overrides chart appVersion)
    tag: ""  # defaults to chart appVersion
    # Image pull policy
    pullPolicy: IfNotPresent

  # Runtime configuration for the provider controller
  runtimeConfig:
    # Controller deployment name
    name: provider-tailscale-config

    # Container arguments
    args:
      # Enable debug logging
      debug: false
      # Poll interval for reconciliation
      # ONE HOUR, AND THIS IS DRIFT DETECTION -- NOT HOW LONG YOUR CHANGE TAKES.
      #
      # READ THIS BEFORE "FIXING" IT BACK TO 1m. The provider WATCHES its managed resources, so
      # editing a spec in git reconciles as soon as ArgoCD applies it -- within seconds, exactly
      # as before. --poll governs only the periodic re-check for drift introduced OUTSIDE
      # Kubernetes: somebody editing the ACL in the Tailscale admin console, or a secret changed
      # in the GitHub UI. Nothing about the GitOps path got slower.
      #
      # WHY IT WAS COSTING SOMETHING. At 1m-5m every managed resource hits its provider API
      # every interval, forever, whether or not anything changed. That is rate-limit budget and,
      # on GCP, billable API calls -- spent continuously to answer a question whose answer is
      # almost always "unchanged". An hour is still far tighter than the time it would take a
      # human to notice console drift.
      #
      # TO FORCE A RECONCILE RIGHT NOW, touch the managed resource -- any metadata change fires
      # the controller watch immediately:
      #
      #   kubectl annotate <kind>/<name> reconcile.mill/requested-at="$(date -u +%FT%TZ)" --overwrite
      #
      # Do that after changing something out-of-band, or when verifying a change end to end.
      # Do NOT lower this value to make a one-off verification faster.
      poll: "1h"
      # Maximum reconciliation rate
      maxReconcileRate: 10
      # Enable management policies feature
      enableManagementPolicies: true

    # Resource limits and requests
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi

    # Security context for the controller container
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    # Pod security context
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      fsGroup: 65532

# ProviderConfig configuration
providerConfig:
  # Name of the ProviderConfig (typically "default")
  name: default
  
  # Secret reference for Tailscale credentials
  secretRef:
    name: tailscale-creds
    namespace: crossplane-system
    key: api_key

# Secret configuration for Tailscale credentials
secret:
  # Create the secret (set to false if using external secret management)
  create: true
  
  # Secret name
  name: tailscale-creds
  
  # Namespace where the secret will be created
  namespace: crossplane-system
  
  # Tailscale API key value
  # Leave empty if using external secret management or ArgoCD Vault Plugin
  apiKey: ""

# Sync wave for ArgoCD (controls deployment order)
syncWave:
  secret: "-2"
  provider: "-1"
  providerConfig: "0"

# Additional labels to apply to all resources
additionalLabels: {}
  # environment: production
  # team: platform

# Additional annotations to apply to all resources
additionalAnnotations: {}
  # example.com/annotation: value
